# One command brings up the whole stack: docker compose up
#
#   Dashboard        http://localhost:8080
#   Short links      http://sho.localhost:8080/<code>
#   API (direct)     http://localhost:3000
#   Caught mail      http://localhost:8025
#
# Host ports can be moved when the defaults are taken, for example
#   WEB_PORT=8081 API_PORT=3001 POSTGRES_PORT=5433 REDIS_PORT=6380 docker compose up
# The credentials and secrets below are for local development only.

x-api-environment: &api-environment
  DATABASE_URL: postgres://shortener:shortener@postgres:5432/shortener
  REDIS_URL: redis://redis:6379
  APP_URL: http://localhost:${WEB_PORT:-8080}
  DEFAULT_SHORT_DOMAIN: sho.localhost
  CNAME_TARGET: cname.sho.localhost
  APP_SECRET: ${APP_SECRET:-local-development-secret-do-not-use-in-production}
  SMTP_URL: smtp://mailpit:1025
  MAIL_FROM: no-reply@sho.localhost
  # The edge is the one proxy in front of the API.
  TRUST_PROXY_HOPS: 1
  BLOCKED_HOSTS: ${BLOCKED_HOSTS:-}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username shortener --dbname shortener']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches every email the platform sends, so nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'

  # Applies pending migrations, then exits. The API starts only if it succeeds.
  migrate:
    build:
      context: .
      target: api
    command: ['node', 'dist/database/run-migrations.js']
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    environment: *api-environment
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--spider',
          'http://127.0.0.1:3000/health/ready',
        ]
      interval: 5s
      timeout: 3s
      start_period: 20s
      start_interval: 1s
      retries: 5

  edge:
    build:
      context: .
      target: edge
    environment:
      APP_HOST: localhost
      API_UPSTREAM: api:3000
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
