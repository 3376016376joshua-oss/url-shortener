name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: shortener
          POSTGRES_DB: shortener
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username shortener --dbname shortener"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:e2e

  dashboard:
    name: Dashboard browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the browser
        run: pnpm --filter @url-shortener/web exec playwright install --with-deps chromium
      - run: pnpm test:web:e2e
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-browser-test-report
          path: apps/web/e2e/dist/report
          retention-days: 7

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack and wait until it is healthy
        run: docker compose up --build --wait
      - name: The API is ready
        run: curl --fail --silent --show-error http://localhost:3000/health/ready
      - name: The edge serves the dashboard on the app host
        run: curl --fail --silent --show-error http://localhost:8080/ | grep --quiet 'id="root"'
      - name: The edge sends a short domain to the API
        # No link exists yet, so the API's own 404 body is the proof.
        run: >-
          curl --silent --show-error --header 'Host: sho.localhost'
          http://localhost:8080/abc1234 | grep --quiet '"code":"LINK_NOT_FOUND"'
      - name: The edge keeps operational endpoints private
        run: |
          for host in localhost sho.localhost; do
            for endpoint in /metrics /metrics/ /internal/tls/authorize /health /health/ready; do
              curl --silent --output /dev/null --dump-header headers.txt \
                --header "Host: $host" "http://localhost:8080$endpoint"
              # A request id would mean the request reached the API.
              if grep --quiet --ignore-case '^x-request-id:' headers.txt; then
                echo "$endpoint on $host is reachable through the edge" >&2
                exit 1
              fi
            done
          done
      - name: Show logs
        if: failure()
        run: docker compose logs
