name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: shortener
          POSTGRES_DB: shortener
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username shortener --dbname shortener"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:e2e

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack and wait until it is healthy
        run: docker compose up --build --wait
      - name: The API is ready
        run: curl --fail --silent --show-error http://localhost:3000/health/ready
      - name: The edge serves the dashboard on the app host
        run: curl --fail --silent --show-error http://localhost:8080/ | grep --quiet 'id="root"'
      - name: The edge sends a short domain to the API
        run: >-
          curl --fail --silent --show-error --header 'Host: sho.localhost'
          http://localhost:8080/health/ready
      - name: The edge keeps operational endpoints private
        run: |
          for endpoint in /metrics /internal/tls/authorize; do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --dump-header headers.txt "http://localhost:8080$endpoint")
            test "$code" = 404
            # A request id would mean the request reached the API.
            if grep --quiet --ignore-case '^x-request-id:' headers.txt; then
              echo "$endpoint is reachable through the edge" >&2
              exit 1
            fi
          done
      - name: Show logs
        if: failure()
        run: docker compose logs
